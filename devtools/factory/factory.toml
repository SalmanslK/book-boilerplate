# The boilerplate's own settings, for its own Book (stack "none"): its names, branches, owners and the values
# it sets differently from the Book's defaults. The defaults are book-defaults.toml and book-defaults/none.toml
# beside this file; every reader merges this file over them (book_config.py), and `python devtools/book.py
# config <key>` prints the merged value. A person confirms every change to this file — the guard asks.
#
# `book init` writes a project's copy from book-template/skeletons/factory.toml.tmpl.

book_version = "1.6.3"
base_ref = "origin/main"
protected_branches = ["main"]
# Each person's private settings file — outside every repository, never read by a session
# (CLAUDE.md, Private settings). BOILERPLATE_LOCAL_SETTINGS ([book] env_prefix + LOCAL_SETTINGS)
# overrides it.
private_settings = "~/.boilerplate/local.toml"

# This project's own names, for `book verify` (a name the Book template carries from another
# project is a leftover; these are not) and the names `book init` wrote.
[book]
name = "Boilerplate"
title = "Book Boilerplate"
slug = "boilerplate"
env_prefix = "BOILERPLATE_"
stack = "none"                    # none | dotnet | pytest
packs = []                        # deploy | bitbucket | fe-guides
# The day this Book took the defects' Type and Source columns (check-book.py).
type_source_from = "2026-11-23"
# The word for the multi-tenant boundary (company, lab); empty = no multi-tenant rules.
scoping_word = ""

# ---------------------------------------------------------------- impact

[impact]
cross_cutting = []
one_way = []
one_way_note = ""

# The risk tier `/book:impact` names: the highest any touched path reaches (regexes).
[tier]
high = ["^devtools/factory/hooks/", "^\\.claude/settings"]
medium = ["^devtools/"]
checks_only = ["docs/**", "requirements/**", "**/*.md"]

# ---------------------------------------------------------------- the files that steer the AI, the tracker, the host

# Owners are Git-host account ids (`book pr whoami`). An empty list fails closed. Without a Bitbucket remote
# `ai-files` reports N/A.
[ai_files]
owners = [
    { name = "Boilerplate owner", account_id = "REPLACE_WITH_ACCOUNT_ID" },
]

# Where `book jira <key>` reads an issue from. Empty = no tracker; `book jira` says so.
[jira]
site = ""
project = ""

# What `book protection --check` holds the live branch restrictions to.
[protection]
branches = ["main"]

# [deploy], [deploy.tests], [deploy.DEV], [deploy.QA] — the deploy pack only.
# [[modules]] — empty in the boilerplate; a project fills them.
