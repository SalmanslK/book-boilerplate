# The core review dimensions: one stack-free file, B0 (checks 16-161), in the book plugin (`book:` paths).
# A stack pack that splits them ships its own review-scope.toml in place of this block, its files in
# the project's `.claude/review/`.
[review_scope]
folder = ".claude/review"
always = ["book:peer-review/references/review-method.md", "book:peer-review/references/review-pass-a.md"]

[review_scope.dimensions]
B0 = "book:peer-review/references/review-b-core.md"

[[review_scope.rows]]
row = "Docs only (`docs/`, other `*.md`)"
match = ["docs/*", "*.md"]
not_applicable = ["B0"]

[[review_scope.rows]]
row = "`requirements/**`"
match = ["requirements/*"]
not_applicable = ["B0"]
