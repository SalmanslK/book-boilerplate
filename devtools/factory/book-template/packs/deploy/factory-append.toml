
# ---------------------------------------------------------------- deploy
#
# The deploy pack: `book deploy` (devtools/factory/deploy.py) and /book:deploy read the project's DEV and QA
# hosts here, and nothing else names one; what every deploy does the same way is the pack's defaults
# (book-defaults/deploy.toml). DEV and QA only: UAT and production go through the team's release process, and
# the guard refuses a deploy that names them. Every <…> is an answer still to give - a deploy stops on one and
# says which, rather than guess a host. `book upgrade` names the keys still to fill. So a filled value holds
# no <…> of its own (an HTML tag such as <title> reads as one); a redirect or `<=` is fine.
[deploy]
ssh_host = "<the DEV/QA host>"
ssh_user = "<the deploy account on it>"
ssh_key = "~/.ssh/<the deploy key>"
backup_root = "<the folder the nightly backups go to>"
# ci_daily = { folder = "~/<the nightly run's folder>", refs = ["dev"] }
# container_uid = "<the API container's user id>"   # its bind mounts and volumes must be its own
protected_probe = "<a real route that answers 401 with no token>"
migrations = "<the migrations folder>"
test_db_variable = "{{env_prefix}}TEST_DB"
smoke_url_variable = "{{env_prefix}}DEPLOYED_API_URL"
smoke_credentials = ["{{env_prefix}}DEPLOYED_API_EMAIL", "{{env_prefix}}DEPLOYED_API_PASSWORD", "{{env_prefix}}DEPLOYED_API_TENANT_KEY"]
# Optional accounts, each an email and password pair, required on the environments `required_on` names.
# smoke_pairs = [{ name = "reviewer", email = "{{env_prefix}}..._EMAIL", password = "{{env_prefix}}..._PASSWORD", reason = "No reviewer account", required_on = ["QA"] }]
# /book:deploy: point `runbook` at the deployment plan's section on the environments past DEV and QA (a path
# with its #anchor), and `audit_record` at where the Book records its last audit.
# runbook = "docs/plans/deployment.md#beyond-qa"

[deploy.tests]
unit = "<the unit test project>"
architecture = "<the architecture test project>"
integration = "<the integration test project>"

[deploy.DEV]
directory = "<the DEV checkout on the host>"
project = "<the DEV Compose project name>"

[deploy.QA]
directory = "<the QA checkout on the host>"
project = "<the QA Compose project name>"

# /book:deploy: this project's own detail for a step, read with the step it names (check, gate, changes, up,
# smoke, revert, report) - who owns which mount, what the probe route proves, the host's quirks. Optional.
# [deploy.notes]
# check = "the mail-drop and logs mounts belong to the API's user; the disk under 10 GB is a BLOCK"
